{% extends "base.html" %}{% block title %}Add Employee | NexaHR{% endblock %}{% block page_heading %}Add Employee{% endblock %}{% block content %}<div class="form-card panel"><h3>Employee details</h3><p class="muted small mb-4">Create a new employee profile for the HR system.</p>{% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}<form method="POST"><div class="row g-3"><div class="col-md-6"><label class="form-label">Full name</label><input class="form-control" name="name" required></div><div class="col-md-6"><label class="form-label">Email</label><input class="form-control" type="email" name="email" required></div><div class="col-md-6"><label class="form-label">Phone</label><input class="form-control" name="phone"></div><div class="col-md-6"><label class="form-label">Joining date</label><input class="form-control" type="date" name="joining_date"></div><div class="col-12"><label class="form-label">Address</label><input class="form-control" name="address"></div><div class="col-md-4"><label class="form-label">Department</label><select class="form-select" name="department_id"><option value="">Select</option>{% for d in departments %}<option value="{{ d.id }}">{{ d.name }}</option>{% endfor %}</select></div><div class="col-md-4"><label class="form-label">Designation</label><select class="form-select" name="designation_id"><option value="">Select</option>{% for d in designations %}<option value="{{ d.id }}">{{ d.name }}</option>{% endfor %}</select></div><div class="col-md-4"><label class="form-label">Manager</label><select class="form-select" name="manager_id"><option value="">No manager</option>{% for m in managers %}<option value="{{ m.id }}">{{ m.name }}</option>{% endfor %}</select></div></div><div class="d-flex justify-content-end gap-2 mt-4"><a class="btn btn-soft" href="/hr/dashboard">Cancel</a><button class="btn btn-primary" type="submit">Create employee</button></div></form></div>{% endblock %}
